
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <!-- Page information -->
    <title>Simarask | Links</title>
    <meta name="description"
          content="Find Simarask on GitHub, Discord, Spotify, Steam, and more.">
    <meta name="theme-color" content="#171717">

    <!-- Social previews -->
    <meta property="og:type" content="website">
    <meta property="og:title" content="Simarask | Links">
    <meta property="og:description"
          content="Find me across the internet.">
    <meta property="og:url"
          content="https://simossssss.github.io/">

    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" href="assets/snus.svg">

    <style>
        /* ===========================
           GLOBAL STYLES
        =========================== */

        :root {
            color-scheme: dark;

            --text: #e5e5e5;
            --muted: #aaaaaa;

            --card-bg: rgba(0, 0, 0, 0.75);
            --button-bg: rgba(61, 61, 61, 0.65);
            --button-hover: rgba(110, 110, 110, 0.35);

            --radius: 14px;
            --transition: 220ms ease;
        }

        *,
        *::before,
        *::after {
            box-sizing: border-box;
        }

        html {
            min-height: 100%;
        }

        body {
            margin: 0;
            min-height: 100vh;
            min-height: 100dvh;

            display: grid;
            place-items: center;

            padding: 24px;

            color: var(--text);
            background: #171717;

            font-family: Arial, Helvetica, sans-serif;
        }

        /* ===========================
           BACKGROUND
        =========================== */

        .background {
            position: fixed;
            inset: -20px;

            width: calc(100% + 40px);
            height: calc(100% + 40px);

            object-fit: cover;

            filter: blur(10px);
            opacity: 0.85;

            z-index: -1;
            pointer-events: none;
        }

        /* ===========================
           MAIN CARD
        =========================== */

        .BigContainer {
            width: min(100%, 380px);

            padding: 32px 24px;

            background: var(--card-bg);

            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: var(--radius);

            box-shadow:
                0 15px 50px rgba(0, 0, 0, 0.4);

            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);

            text-align: center;
        }

        /* ===========================
           HEADER
        =========================== */

        .profile-name {
            margin: 0;

            font-family: "Brush Script MT", cursive;
            font-size: clamp(2.2rem, 6vw, 3rem);
            font-weight: normal;
        }

        .divider {
            border: none;
            height: 1px;

            margin: 22px 0;

            background: linear-gradient(
                to right,
                transparent,
                rgba(255, 255, 255, 0.35),
                transparent
            );
        }

        /* ===========================
           LINKS
        =========================== */

        .links {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .smallContainer {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;

            position: relative;

            width: 100%;
            min-height: 52px;

            padding: 12px 18px;

            background: var(--button-bg);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 10px;

            color: var(--text);
            text-decoration: none;

            font-size: 1rem;
            font-weight: 500;

            cursor: pointer;

            transition:
                background-color var(--transition),
                transform var(--transition),
                box-shadow var(--transition),
                border-color var(--transition);
        }

        .smallContainer img {
            width: 24px;
            height: 24px;

            object-fit: contain;
            flex-shrink: 0;
        }

        .smallContainer:hover {
            background: var(--button-hover);

            transform: translateY(-3px) scale(1.02);

            border-color: rgba(255, 255, 255, 0.2);

            box-shadow:
                0 8px 25px rgba(0, 0, 0, 0.3);
        }

        .smallContainer:active {
            transform: scale(0.98);
        }

        .smallContainer:focus-visible {
            outline: 2px solid #ffffff;
            outline-offset: 4px;
        }

        /* ===========================
           MOBILE
        =========================== */

        @media (max-width: 480px) {
            body {
                padding: 16px;
            }

            .BigContainer {
                padding: 26px 20px;
            }

            .smallContainer {
                min-height: 54px;
            }
        }

        /* ===========================
           ACCESSIBILITY
        =========================== */

        @media (prefers-reduced-motion: reduce) {
            *,
            *::before,
            *::after {
                animation-duration: 0.01ms !important;
                transition-duration: 0.01ms !important;
            }

            .background {
                display: none;
            }
        }
    </style>
</head>

<body>

    <!-- Animated background -->
    <img
        class="background"
        src="assets/digaxn7-b52c9765-13ce-4034-b99d-f1a6b1030161.gif"
        alt=""
        aria-hidden="true"
    >

    <!-- Main content -->
    <main class="BigContainer">

        <header>
            <h1 class="profile-name">Simarask</h1>
        </header>

        <hr class="divider">

        <nav class="links" aria-label="Social links">

            <!-- GitHub -->
            <a
                class="smallContainer"
                href="https://github.com/simossssss/"
                target="_blank"
                rel="noopener noreferrer"
            >
                <img src="assets/github.png" alt="">
                <span>GitHub</span>
            </a>

            <!-- Discord -->
            <a
                class="smallContainer"
                href="https://discordapp.com/users/765208539730935838"
                target="_blank"
                rel="noopener noreferrer"
            >
                <img src="assets/discord.png" alt="">
                <span>Discord</span>
            </a>

            <!-- Spotify -->
            <a
                class="smallContainer"
                href="https://open.spotify.com/user/phsimopoulos?si=a00b3c15b85d4c63"
                target="_blank"
                rel="noopener noreferrer"
            >
                <img src="assets/spotify.png" alt="">
                <span>Spotify</span>
            </a>

            <!-- Steam -->
            <a
                class="smallContainer"
                href="https://steamcommunity.com/id/philipsi08/"
                target="_blank"
                rel="noopener noreferrer"
            >
                <img src="assets/steam.png" alt="">
                <span>Steam</span>
            </a>

            <!-- Instagram (definitely Instagram...) -->
            <a
                class="smallContainer"
                href="https://youtu.be/xMHJGd3wwZk?si=ubvFCJp2Qvz8dy-x"
                target="_blank"
                rel="noopener noreferrer"
            >
                <img src="assets/instagram-new.png" alt="">
                <span>Instagram</span>
            </a>

        </nav>

    </main>

</body>
</html>
